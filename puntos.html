<!-- CONTENIDO -->
<div class="container mt-5 pt-5">
  <h1 class="section-title text-center mb-4">Sistema de Puntos Ecológicos</h1>

  <div class="section-box fade-in">
    <form id="puntosForm">
      <label class="fw-bold">Nombre del estudiante</label>
      <input type="text" id="estudiante" class="form-control mb-3" required>

      <label class="fw-bold">Actividad</label>
      <select id="actividadPuntos" class="form-control mb-3">
        <option value="5">Trajo material reciclable (+5)</option>
        <option value="10">Creó un cartel ambiental (+10)</option>
        <option value="3">Separó residuos correctamente (+3)</option>
        <option value="7">Participó en limpieza (+7)</option>
      </select>

      <button type="button" class="btn btn-custom w-100" onclick="guardarPuntos()">Guardar Puntos</button>
    </form>
  </div>

  <div class="section-box mt-4 fade-in">
    <h4 class="fw-bold text-success">Tabla de Puntos</h4>
    <ul class="list-group mt-3" id="listaPuntos"></ul>
    <button class="btn btn-danger mt-3 w-100" onclick="borrarTodo()">Borrar Todo</button>
  </div>
</div>

<div class="footer">
  <p class="mb-0">🏆 Gamificación del Proyecto 3R</p>
</div>

<script>
function guardarPuntos(){
  let estudiante = document.getElementById("estudiante").value;
  let puntos = parseInt(document.getElementById("actividadPuntos").value);

  if(estudiante.trim() === ""){
    alert("Escribe un nombre");
    return;
  }

  let datos = JSON.parse(localStorage.getItem("puntos3R")) || [];
  datos.push({estudiante, puntos});

  localStorage.setItem("puntos3R", JSON.stringify(datos));
  document.getElementById("puntosForm").reset();
  mostrarPuntos();
}

function mostrarPuntos(){
  let datos = JSON.parse(localStorage.getItem("puntos3R")) || [];
  let lista = document.getElementById("listaPuntos");
  lista.innerHTML = "";

  datos.forEach((d, i) => {
    lista.innerHTML += `
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <span><strong>${d.estudiante}</strong></span>
        <span class="badge bg-success fs-6">${d.puntos} pts</span>
      </li>
    `;
  });
}

function borrarTodo(){
  localStorage.removeItem("puntos3R");
  mostrarPuntos();
}

document.addEventListener("DOMContentLoaded", mostrarPuntos);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
